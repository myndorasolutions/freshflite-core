; FreshFlite ESP32-S3-WROOM-1 (16MB flash) on the DevKitC-1.
; Arduino framework on the ESP-IDF core. default_16MB.csv includes SPIFFS.

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<host/>
lib_deps =
  adafruit/Adafruit SHT31 Library
  adafruit/Adafruit LIS3DH
  knolleary/PubSubClient

; Host build of the packet harness only. Used when g++/clang++ are absent and pio is installed.
[env:host-packet]
platform = native
build_src_filter = +<host/>
build_flags = -std=c++17
